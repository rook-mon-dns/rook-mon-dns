# This rule is not used by the project rook-mon-dns itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the rook-mon-dns.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: rook-mon-dns
    app.kubernetes.io/managed-by: kustomize
  name: cephmondnsendpoint-editor-role
rules:
- apiGroups:
  - rook-mon-dns.github.io
  resources:
  - cephmondnsendpoints
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rook-mon-dns.github.io
  resources:
  - cephmondnsendpoints/status
  verbs:
  - get
