---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - externaldns.k8s.io
  resources:
  - dnsendpoints
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rook-mon-dns.github.io
  resources:
  - cephmondnsendpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rook-mon-dns.github.io
  resources:
  - cephmondnsendpoints/finalizers
  verbs:
  - update
- apiGroups:
  - rook-mon-dns.github.io
  resources:
  - cephmondnsendpoints/status
  verbs:
  - get
  - patch
  - update
