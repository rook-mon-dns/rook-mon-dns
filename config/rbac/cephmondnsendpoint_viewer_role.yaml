# This rule is not used by the project rook-mon-dns itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to cephmons.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: rook-mon-dns
    app.kubernetes.io/managed-by: kustomize
  name: cephmondnsendpoint-viewer-role
rules:
- apiGroups:
  - cephmons.github.io
  resources:
  - cephmondnsendpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cephmons.github.io
  resources:
  - cephmondnsendpoints/status
  verbs:
  - get
