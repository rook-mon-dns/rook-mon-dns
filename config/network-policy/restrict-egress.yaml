# This NetworkPolicy restricts the operator's egress traffic to the
# Kubernetes API server and DNS. The operator talks to nothing else.
#
# The API server rule is port-based on purpose: most CNIs (Calico, Cilium)
# evaluate egress after the service IP was translated to the real API server
# endpoint (node IP, usually port 6443), so a service-CIDR ipBlock would block it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: rook-mon-dns
    app.kubernetes.io/managed-by: kustomize
  name: restrict-egress
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: rook-mon-dns
  policyTypes:
    - Egress
  egress:
    # Kubernetes API server (service port 443, endpoint port 6443)
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # DNS resolution (CoreDNS/kube-dns), as a safety net
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
