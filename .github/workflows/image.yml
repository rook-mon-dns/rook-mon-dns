name: Image

# Builds and pushes ghcr.io/<owner>/<repo> with the repository's GITHUB_TOKEN:
# - push to main: tags "main" and "sha-<short commit>"
# - tag v*:       tag "<git tag>" (e.g. v0.1.0) and "sha-<short commit>"
#                 plus the Helm chart oci://ghcr.io/<owner>/charts/rook-mon-dns
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    permissions:
      contents: read
      packages: write
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    # Release tags only: chart version = tag without "v", appVersion = tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    permissions:
      contents: read
      packages: write
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Push chart to oci://ghcr.io/<owner>/charts
        env:
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm package charts/rook-mon-dns --version "${TAG#v}" --app-version "$TAG" -d dist
          helm push "dist/rook-mon-dns-${TAG#v}.tgz" "oci://ghcr.io/${OWNER}/charts"
