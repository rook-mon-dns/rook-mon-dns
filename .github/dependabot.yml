version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Also update indirect modules: vulnerable transitive dependencies
    # (x/net, grpc, otel via the Kubernetes libraries) are otherwise ignored.
    allow:
      - dependency-type: all
    groups:
      # One PR for all Go module updates instead of one per module.
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
