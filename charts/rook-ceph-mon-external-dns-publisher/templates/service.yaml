{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rook-ceph-mon-external-dns-publisher.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rook-ceph-mon-external-dns-publisher.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rook-ceph-mon-external-dns-publisher.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
{{- end }}
