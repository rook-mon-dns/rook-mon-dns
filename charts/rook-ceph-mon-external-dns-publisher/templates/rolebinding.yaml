{{- range .Values.watchNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rook-ceph-mon-external-dns-publisher.fullname" $ }}-manager-rolebinding
  namespace: {{ . }}
  labels:
    {{- include "rook-ceph-mon-external-dns-publisher.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rook-ceph-mon-external-dns-publisher.fullname" $ }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "rook-ceph-mon-external-dns-publisher.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
---
{{- end }}
