{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rook-ceph-mon-external-dns-publisher.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rook-ceph-mon-external-dns-publisher.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rook-ceph-mon-external-dns-publisher.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # kubelet health probes (/healthz, /readyz expose no data beyond "ok")
    - ports:
        - port: 8081
          protocol: TCP
    {{- if .Values.metrics.enabled }}
    # metrics scraping only from namespaces carrying the configured labels
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsNamespaceLabels | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
  egress:
    # Kubernetes API server
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.apiServerCIDR }}
      ports:
        - port: 443
          protocol: TCP
    # DNS resolution (CoreDNS/kube-system), as a safety net
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
