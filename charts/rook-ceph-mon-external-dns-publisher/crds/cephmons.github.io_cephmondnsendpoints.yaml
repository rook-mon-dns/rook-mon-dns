      type: string
    - jsonPath: .spec.zone
      name: Zone
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CephMonDNSEndpoint is the Schema for the cephmondnsendpoints
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CephMonDNSEndpoint
            properties:
              allRecordName:
                default: mon-all
                description: |-
                  allRecordName is an additional A record (relative to the zone) that
                  contains all monitor node IPs at once. Set to an empty string to
                  disable the aggregate record.
                maxLength: 253
                type: string
              configMapRef:
                default: {}
                description: configMapRef references the Rook Ceph mon endpoints ConfigMap.
                properties:
                  name:
                    default: rook-ceph-mon-endpoints
