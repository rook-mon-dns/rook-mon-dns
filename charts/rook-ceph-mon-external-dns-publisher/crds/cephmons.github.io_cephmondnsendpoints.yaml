                type: string
              ttl:
                default: 300
                description: ttl of the published DNS records in seconds.
                format: int64
                maximum: 86400
                minimum: 0
                type: integer
              zone:
                description: |-
                  zone is the base DNS zone all records are published in
                  (e.g. "ceph.example.com"). If the operator is started with
                  --allowed-zones, the zone must be contained in that list.
                maxLength: 253
                minLength: 1
                pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)*[a-z0-9]([-a-z0-9]*[a-z0-9])?$
