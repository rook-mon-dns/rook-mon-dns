    controller-gen.kubebuilder.io/version: v0.21.0
  name: cephmondnsendpoints.cephmons.github.io
spec:
  group: cephmons.github.io
  names:
    kind: CephMonDNSEndpoint
    listKind: CephMonDNSEndpointList
    plural: cephmondnsendpoints
    shortNames:
    - cmde
    singular: cephmondnsendpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
