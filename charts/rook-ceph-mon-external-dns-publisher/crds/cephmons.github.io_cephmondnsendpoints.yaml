                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      namespace of the ConfigMap. Must be empty or equal to the namespace of
                      this CephMonDNSEndpoint (enforced by the operator).
                    type: string
                type: object
              recordTemplate:
                default: mon{n}
                description: |-
                  recordTemplate is the per-monitor record name, relative to the zone.
                  Supported placeholders: {n} = stable sequence number (monitors sorted
                  by mon ID, starting at 1), {id} = Rook mon ID (unstable across
                  failovers). Example: "mon{n}" results in "mon1.<zone>", "mon2.<zone>".
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: recordTemplate must contain at least one of the placeholders
                    {n} or {id}
                  rule: self.contains('{n}') || self.contains('{id}')
              srv:
                default: {}
                description: srv configures the optional SRV record used for Ceph
                  mon discovery.
                properties:
                  enabled:
                    default: false
                    description: |-
                      enabled controls whether a SRV record is published in addition to the
                      A records.
                    type: boolean
                  name:
                    default: _ceph-mon._tcp
                    description: |-
                      name of the SRV record, relative to the zone (e.g. "_ceph-mon._tcp"
                      results in "_ceph-mon._tcp.<zone>").
                    minLength: 1
                    type: string
                type: object
              targetNamespace:
