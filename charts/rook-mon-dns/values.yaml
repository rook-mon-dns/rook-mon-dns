# Default values for rook-mon-dns.

replicaCount: 1

image:
  repository: ghcr.io/rook-mon-dns/rook-mon-dns
  # tag defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# Namespaces the operator watches and reconciles in. One Role/RoleBinding pair
# is created per namespace. CephMonDNSEndpoint resources, their source
# ConfigMaps and the generated DNSEndpoints must all live in these namespaces.
watchNamespaces:
  - rook-ceph

# DNS zones that CephMonDNSEndpoint resources may publish in.
# Empty list = no restriction.
allowedZones: []

leaderElection: true

# Metrics endpoint (plain HTTP on :8080). Protect it with the NetworkPolicy
# below (default) or your monitoring setup.
metrics:
  enabled: true

networkPolicy:
  enabled: true
  # Egress ports to the Kubernetes API server: the service port and the
  # port of the API server endpoint itself (6443 on most distributions).
  apiServerPorts: [443, 6443]
  # Only namespaces carrying these labels may scrape the metrics endpoint.
  metricsNamespaceLabels:
    metrics: enabled

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    # No CPU limit on purpose (CFS throttling); memory limit is mandatory.
    memory: 128Mi
