{{- range .Values.watchNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rook-mon-dns.fullname" $ }}-manager-role
  namespace: {{ . }}
  labels:
    {{- include "rook-mon-dns.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["rook-mon-dns.github.io"]
    resources: ["cephmondnsendpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rook-mon-dns.github.io"]
    resources: ["cephmondnsendpoints/finalizers"]
    verbs: ["update"]
  - apiGroups: ["rook-mon-dns.github.io"]
    resources: ["cephmondnsendpoints/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["externaldns.k8s.io"]
    resources: ["dnsendpoints"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
{{- end }}
