{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rook-mon-dns.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rook-mon-dns.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rook-mon-dns.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # kubelet health probes (/healthz, /readyz expose no data beyond "ok")
    - ports:
        - port: 8081
          protocol: TCP
    {{- if .Values.metrics.enabled }}
    # metrics scraping only from namespaces carrying the configured labels
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsNamespaceLabels | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
  egress:
    # Kubernetes API server, port-based: CNIs evaluate egress after the
    # service IP was translated to the API server endpoint.
    - ports:
        {{- range .Values.networkPolicy.apiServerPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    # DNS resolution (CoreDNS/kube-system), as a safety net
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
